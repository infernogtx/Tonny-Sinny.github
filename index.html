<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
    <div class="container">
        <div class="boxlogin">
            <form action="">
                <h1>
                    LOGIN
                </h1>
                <div class="inputbox">
                    <input type="email" alt="text" placeholder="Name" required>
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="inputbox">
                    <input type="password" alt="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="social">
                    <p>Social</p>
                </div>
                <div class="icons">
                    <a class="github" href="https://github.com/infernogtx"><i class="fa-brands fa-github"></i></a> <a class="github" href="https://www.google.com/?hl=ru"><i class="fa-brands fa-google"></i></a><a class="github" href="https://discord.com/"><i class="fa-brands fa-discord"></i></a><a class="github" href="https://account.apple.com/"><i class="fa-brands fa-apple"></i></a>   
                </div>
                <div class="line">
                </div>
                <div class="remember">
                    <label>
                        <input class="remember" type="checkbox" required> Remember me <a class="remember__link" href="#">Forger Password</a>
                    </label>
                <div class="button">
                    <button class="btn" type="submit">Login</button>
                </div>
                
                
                    

            </form>
        </div>
    </div>
    
                

</body>
</html>
